<!-- templates/books.html — Lists all books -->
{% extends 'main.html' %}

{% block title %}All Books — Library{% endblock %}

{% block content %}
<h1 class="mb-4">All Books</h1>

<div class="row">
    <!-- Loop through each book passed from the view via context -->
    {% for book in books %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ book.title }}</h5>
                <p class="card-text text-muted">
                    By {{ book.author }} &middot; {{ book.year }}
                </p>
                <p class="card-text">{{ book.description }}</p>
                <!-- {% url 'book_detail' book.id %} builds the URL /books/1/ etc. -->
                <a href="{% url 'book_detail' book.id %}" class="btn btn-outline-primary">
                    View Details
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <!-- Shown if the books list is empty -->
    <p>No books available.</p>
    {% endfor %}
</div>
{% endblock %}
