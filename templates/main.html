<!-- templates/main.html — Base template that all pages extend -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Management{% endblock %}</title>

    <!-- Bootstrap 5 CSS (from CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navbar (included from a separate file) -->
    {% include 'components/navbar.html' %}

    <!-- Main content — child templates fill this block -->
    <main class="container my-4">
        {% block content %}
        <!-- Child templates put their content here -->
        {% endblock %}
    </main>

    <!-- Footer (included from a separate file) -->
    {% include 'components/footer.html' %}

    <!-- Bootstrap 5 JS (from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
